name: Noda
description: >-
  Noda (formerly Infogrid) is an agentic AI platform for commercial real estate
  building operations. It functions as an always-on AI virtual building engineer
  that connects to a portfolio's building management systems (BMS), IoT, weather,
  and utility data, continuously detects faults and energy waste, identifies root
  causes, generates quantified savings recommendations, and executes authorized
  setpoint and load adjustments — tying every action to measured, audit-ready ROI.
  The platform processes 100M+ data points daily and reports 15-25% annual energy
  reduction across deployed assets. Trusted by owners and operators of 400M+
  square feet including Hilton, JLL, CBRE, Macerich, Cousins, DivcoWest and
  Salesforce. ISO 27001 certified and hosted on AWS in the United States. Backed
  by Northzone. Noda exposes no public developer API; onboarding is
  enterprise/demo-based.
